<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Sign In</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" id="authCard">
      <!-- App Header & Logo -->
      <div class="auth-header">
        <div class="auth-logo-badge" id="authLogoBadge">✓</div>
        <h1 class="auth-title" id="authAppTitle">TaskFlow</h1>
        <p class="auth-subtitle" id="authSubtitle">Welcome back! Please enter your details.</p>
      </div>

      <!-- 1. ROLE SWITCHER (USER vs ADMIN) -->
      <div class="role-switcher">
        <button type="button" class="role-btn active" id="userRoleBtn">
          <span class="role-icon">👤</span>
          <span>User Login</span>
        </button>
        <button type="button" class="role-btn admin-role" id="adminRoleBtn">
          <span class="role-icon">🛡️</span>
          <span>Admin Login</span>
        </button>
      </div>

      <!-- Demo Credentials Quick-Fill Hint -->
      <div class="demo-hint-card" id="demoHintCard">
        <span>Demo: <strong id="demoCredText">vrunda.dilip@taskflow.dev</strong> / 123456</span>
        <button type="button" class="btn-fill-demo" id="fillDemoBtn">Auto Fill</button>
      </div>

      <!-- 2. TAB SWITCHER (Sign In / Create Account) - hidden in Admin mode -->
      <div class="auth-tabs" id="authTabsContainer">
        <button type="button" class="auth-tab-btn active" id="loginTabBtn">Sign In</button>
        <button type="button" class="auth-tab-btn" id="registerTabBtn">Create Account</button>
      </div>

      <!-- 3. LOGIN FORM -->
      <form id="loginForm" novalidate>
        <input type="hidden" id="loginSelectedRole" value="user">

        <!-- Email Input -->
        <div class="form-group">
          <label for="loginEmail" id="loginEmailLabel">User Email Address</label>
          <input 
            type="email" 
            id="loginEmail" 
            class="form-control" 
            placeholder="vrunda.dilip@taskflow.dev" 
            autocomplete="email"
            required
          >
          <div class="error-msg" id="loginEmailError"></div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="loginPassword" 
              class="form-control" 
              placeholder="••••••••" 
              autocomplete="current-password"
              required
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              data-target="loginPassword" 
              aria-label="Toggle password visibility"
              title="Show / hide password"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="error-msg" id="loginPasswordError"></div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="auth-options">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember me</span>
          </label>
          <a href="#" class="auth-link" onclick="alert('Password reset instructions will be sent to your email.'); return false;">Forgot password?</a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
          Sign In to TaskFlow
        </button>

        <div class="auth-switch" id="userRegisterSwitch">
          Don't have an account? <a href="#" id="switchToRegister">Register now</a>
        </div>

        <div class="auth-switch" id="adminNoticeSwitch" style="display: none; font-size: 12.5px;">
          🛡️ Administrator access is restricted to verified team leads.
        </div>
      </form>

      <!-- 4. REGISTER FORM (For regular users only) -->
      <form id="registerForm" style="display: none;" novalidate>
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input 
            type="text" 
            id="regName" 
            class="form-control" 
            placeholder="e.g. Vrunda Dilip" 
            required
          >
          <div class="error-msg" id="regNameError"></div>
        </div>

        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input 
            type="email" 
            id="regEmail" 
            class="form-control" 
            placeholder="name@company.com" 
            autocomplete="email"
            required
          >
          <div class="error-msg" id="regEmailError"></div>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="regPassword" 
              class="form-control" 
              placeholder="Minimum 6 characters" 
              autocomplete="new-password"
              required
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              data-target="regPassword" 
              aria-label="Toggle password visibility"
              title="Show / hide password"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <div class="error-msg" id="regPasswordError"></div>
        </div>

        <!-- Register Button -->
        <button type="submit" class="btn btn-primary btn-block">
          Create Free Account
        </button>

        <div class="auth-switch">
          Already have an account? <a href="#" id="switchToLogin">Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- UI Script for Role Switching (Keeps auth.js untouched) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const userBtn = document.getElementById("userRoleBtn");
      const adminBtn = document.getElementById("adminRoleBtn");
      const authCard = document.getElementById("authCard");
      const appTitle = document.getElementById("authAppTitle");
      const subtitle = document.getElementById("authSubtitle");
      const emailLabel = document.getElementById("loginEmailLabel");
      const emailInput = document.getElementById("loginEmail");
      const passInput = document.getElementById("loginPassword");
      const loginBtn = document.getElementById("loginSubmitBtn");
      const tabs = document.getElementById("authTabsContainer");
      const userRegisterSwitch = document.getElementById("userRegisterSwitch");
      const adminNoticeSwitch = document.getElementById("adminNoticeSwitch");
      const demoText = document.getElementById("demoCredText");
      const fillBtn = document.getElementById("fillDemoBtn");
      const roleInput = document.getElementById("loginSelectedRole");

      let currentRole = "user";

      function setRole(role) {
        currentRole = role;
        roleInput.value = role;

        if (role === "admin") {
          userBtn.classList.remove("active");
          adminBtn.classList.add("active");
          authCard.classList.add("admin-mode");

          appTitle.textContent = "TaskFlow Admin";
          subtitle.textContent = "Administrator Portal — Monitor team tasks & progress.";
          emailLabel.textContent = "Admin Email Address";
          emailInput.placeholder = "admin@taskflow.dev";
          loginBtn.textContent = "Sign In as Admin";

          tabs.style.display = "none";
          userRegisterSwitch.style.display = "none";
          adminNoticeSwitch.style.display = "block";
          demoText.textContent = "admin@taskflow.dev / admin123";

          // Make sure login form is visible
          document.getElementById("loginForm").style.display = "block";
          document.getElementById("registerForm").style.display = "none";
        } else {
          adminBtn.classList.remove("active");
          userBtn.classList.add("active");
          authCard.classList.remove("admin-mode");

          appTitle.textContent = "TaskFlow";
          subtitle.textContent = "Welcome back! Please enter your details.";
          emailLabel.textContent = "User Email Address";
          emailInput.placeholder = "vrunda.dilip@taskflow.dev";
          loginBtn.textContent = "Sign In to TaskFlow";

          tabs.style.display = "flex";
          userRegisterSwitch.style.display = "block";
          adminNoticeSwitch.style.display = "none";
          demoText.textContent = "vrunda.dilip@taskflow.dev / 123456";
        }
      }

      userBtn.addEventListener("click", () => setRole("user"));
      adminBtn.addEventListener("click", () => setRole("admin"));

      fillBtn.addEventListener("click", () => {
        if (currentRole === "admin") {
          emailInput.value = "admin@taskflow.dev";
          passInput.value = "admin123";
        } else {
          emailInput.value = "vrunda.dilip@taskflow.dev";
          passInput.value = "123456";
        }
      });

      // Intercept login submit to redirect admin to admin-dashboard.html
      const form = document.getElementById("loginForm");
      form.addEventListener("submit", (e) => {
        if (currentRole === "admin") {
          e.preventDefault();
          const emailVal = emailInput.value.trim();
          const passVal = passInput.value;

          if (!emailVal || !passVal) return; // let form show errors

          sessionStorage.setItem("taskflow_auth", JSON.stringify({
            isLoggedIn: true,
            email: emailVal,
            role: "admin"
          }));

          if (typeof showToast === "function") {
            showToast("Admin login verified! Loading Admin Console...", "success");
          }
          setTimeout(() => {
            window.location.href = "admin-dashboard.html";
          }, 700);
        }
      }, true); // capture phase to handle admin redirect before user flow
    });
  </script>

  <!-- Shared Scripts (auth.js remains untouched) -->
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
